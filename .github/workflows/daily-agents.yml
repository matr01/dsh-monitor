name: Daily Research Agents

on:
  schedule:
    - cron: '0 4 * * *' # Každé úterý a pátek ve 4:00 UTC
  workflow_dispatch:       # Ruční spuštění
    inputs:
      model:
        description: Gemini model
        type: choice
        options: [gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-3.8-flash]
        default: gemini-3.5-flash-lite
      suffix:
        description: >-
          Přípona výstupní složky, např. "b" → output/YYYY-MM-DD-b. Povolené znaky A-Z a-z 0-9 . _ -
          Prázdné pole zapisuje do output/YYYY-MM-DD.
        type: string
        required: false
        default: ''

permissions:
  contents: write

env:
  DSH_HOME: /workspace/.dsh

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: ghcr.io/smanx/deepseek-harness:devtools-min-0.2.2-rc.3
      options: --user root

    steps:
      - name: Resolve output directory
        env:
          OUTPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          if [ -n "$OUTPUT_SUFFIX" ] && ! printf '%s' "$OUTPUT_SUFFIX" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Neplatný suffix '$OUTPUT_SUFFIX' (povolené znaky A-Z a-z 0-9 . _ -)"
            exit 1
          fi
          OUTPUT_DIR="output/$(date -u +%Y-%m-%d)${OUTPUT_SUFFIX:+-$OUTPUT_SUFFIX}"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"
          echo "Výstupní složka: $OUTPUT_DIR"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure DSH
        env:
          MODEL: ${{ inputs.model || 'gemini-3.5-flash-lite' }}
        run: |
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/cordis.patch.yml" << EOF
          - id: agent-default-model
            config:
              provider: google
              model: $MODEL
          # LLM titulek by byl zbytečný požadavek navíc (free limit Gemini je cca 20/den).
          - id: session-title-llm
            disabled: true
          - id: llm-pi-ai
            config:
              providers:
                # Vestavěná routa (nativní Gemini protokol); bez api/baseURL.
                google:
                  apiKeyEnv: GEMINI_API_KEY
                  # Free tier Gemini má cca 5 požadavků/min, proto delší backoff.
                  retryPolicy:
                    mode: normal
                    maxRetries: 3
                    retryableCodes: [RATE_LIMIT, SERVER, EMPTY_RESPONSE, TIMEOUT, TRANSPORT]
                    backoff:
                      initialDelayMs: 20000
                      maxDelayMs: 60000
                      jitterRatio: 0.2
                  # contextWindow je záměrně pod free-tier limitem vstupních tokenů/min.
                  models:
                    - id: gemini-3.8-flash
                      contextWindow: 250000
                      maxTokens: 8192
                    - id: gemini-3.5-flash-lite
                      contextWindow: 250000
                      maxTokens: 8192
                    - id: gemini-3.1-flash-lite
                      contextWindow: 250000
                      maxTokens: 8192
          EOF

      - name: Run all monitor agents sequentially
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for prompt_file in prompts/*.md; do
            echo "=== Spouštím: $prompt_file ==="
            timeout --signal=TERM --kill-after=15s 30m dsh --profile headless "$(cat "$prompt_file")"
          done

          mkdir -p "$OUTPUT_DIR"
          # Agent ukládá výsledky do kořene repozitáře.
          for f in *.md; do
            [ -f "$f" ] || continue
            [ "$f" = "README.md" ] && continue
            mv "$f" "$OUTPUT_DIR/"
          done

      - name: Commit and push results
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_DIR/"
          git diff --staged --quiet || git commit -m "Daily results ${OUTPUT_DIR#output/}"
          git push

      - name: Upload DSH logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-logs
          path: |
            ${{ env.DSH_HOME }}/logs/
            ${{ env.DSH_HOME }}/sessions/
          if-no-files-found: warn
