name: Daily Research Agents

on:
  schedule:
    - cron: '0 4 * * 2,5' # Každé úterý a pátek ve 4:00 UTC
  workflow_dispatch:       # Ruční spuštění
    inputs:
      provider:
        description: LLM provider
        type: choice
        options: [google, groq, zai]
        default: google
      model:
        description: >-
          Google: gemini-3.5-flash-lite (výchozí), gemini-3.1-flash-lite, gemini-3.8-flash.
          Groq: qwen/qwen3.8-27b (výchozí).
          Z.ai: glm-4.7-flash (výchozí), glm-4.5-flash. Prázdné pole zvolí výchozí model providera.
        type: string
        required: false

permissions:
  contents: write

env:
  DSH_HOME: /workspace/.dsh

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: ghcr.io/smanx/deepseek-harness:devtools-min-0.2.2-rc.3
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Minimal PTC plugin
        run: dsh plugin --profile web add dsh-minimal-ptc ./.github/dsh

      - name: Configure DSH LLM providers
        run: |
          mkdir -p $DSH_HOME
          cat > $DSH_HOME/cordis.patch.yml << 'EOF'
          - id: agent-default-model
            config:
              provider: google
              model: gemini-3.5-flash-lite
          - id: compaction-basic
            config:
              thresholdRatio: 0.25
              headroomTokens: 0
              retainTokens: 256
              maxTokens: 1024
          - id: system-prompt
            config:
              personaSuffix: |
                Start every run_code program with a 15-second delay:
                `await new Promise(r => setTimeout(r, 15000))`.
                This avoids provider rate limits.
          # 429/503 opakuje CI runner (respektuje retry-after, max 3 pokusy);
          # retryPolicy proto RATE_LIMIT, QUOTA ani SERVER znovu neopakuje.
          - id: llm-pi-ai
            config:
              providers:
                # Vestavěná routa (nativní Gemini protokol); bez `api`/`baseURL`.
                google:
                  apiKeyEnv: GEMINI_API_KEY
                  retryPolicy:
                    mode: normal
                    maxRetries: 2
                    retryableCodes: [EMPTY_RESPONSE, TIMEOUT, TRANSPORT]
                    backoff:
                      initialDelayMs: 15000
                      maxDelayMs: 60000
                      jitterRatio: 0.2
                  # contextWindow je záměrně pod free-tier limitem vstupních tokenů/min.
                  models:
                    - id: gemini-3.8-flash
                      contextWindow: 250000
                      maxTokens: 8192
                    - id: gemini-3.5-flash-lite
                      contextWindow: 250000
                      maxTokens: 8192
                    - id: gemini-3.1-flash-lite
                      contextWindow: 250000
                      maxTokens: 8192
                groq:
                  api: openai-completions
                  baseURL: https://api.groq.com/openai/v1
                  apiKeyEnv: GROQ_API_KEY
                  compat:
                    supportsDeveloperRole: false
                  retryPolicy:
                    mode: normal
                    maxRetries: 2
                    retryableCodes: [EMPTY_RESPONSE, TIMEOUT, TRANSPORT]
                    backoff:
                      initialDelayMs: 40000
                      maxDelayMs: 60000
                      jitterRatio: 0.2
                  models:
                    - id: qwen/qwen3.8-27b
                      contextWindow: 6000
                      maxTokens: 2048
                      compat:
                        supportsDeveloperRole: false
                zai:
                  api: openai-completions
                  baseURL: https://api.z.ai/api/paas/v4
                  apiKeyEnv: ZAI_API_KEY
                  compat:
                    supportsDeveloperRole: false
                  retryPolicy:
                    mode: normal
                    maxRetries: 2
                    retryableCodes: [EMPTY_RESPONSE, TIMEOUT, TRANSPORT]
                    backoff:
                      initialDelayMs: 15000
                      maxDelayMs: 60000
                      jitterRatio: 0.2
                  models:
                    - id: glm-4.7-flash
                      contextWindow: 200000
                      maxTokens: 8192
                      compat:
                        supportsDeveloperRole: false
                    - id: glm-4.5-flash
                      contextWindow: 128000
                      maxTokens: 8192
                      compat:
                        supportsDeveloperRole: false
          EOF
      
      - name: Run all monitor agents sequentially
        env:
          DSH_AGENT_PRESET: ptc-minimal
          DSH_CI_PROVIDER: ${{ inputs.provider || 'google' }}
          DSH_CI_MODEL: ${{ inputs.model || (inputs.provider == 'groq' && 'qwen/qwen3.8-27b' || (inputs.provider == 'zai' && 'glm-4.7-flash' || 'gemini-3.5-flash-lite')) }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          for prompt_file in prompts/*.md; do
            echo "=== Spouštím: $prompt_file ==="
            DSH_CI_PROMPT_FILE="$prompt_file" timeout --signal=TERM --kill-after=15s 30m dsh --profile web --no-open
          done

          mkdir -p output/$TODAY
          # Předpokládáme, že agent vytvořil soubory v kořeni
          for f in *.md; do
            [ -f "$f" ] || continue
            [ "$f" = "README.md" ] && continue
            mv "$f" output/$TODAY/
          done

      - name: LLM request summary
        if: always()
        run: |
          f="$DSH_HOME/llm-requests.tsv"
          if [ ! -f "$f" ]; then echo "Celkem LLM požadavků: 0"; exit 0; fi
          awk -F '\t' '{ printf "%s: %d LLM požadavků (z toho %d opakování)\n", $1, $2, $3; r += $2; t += $3 }
            END { printf "Celkem LLM požadavků: %d (z toho %d opakování)\n", r, t }' "$f" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push results
        working-directory: ${{ github.workspace }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/$TODAY/
          git diff --staged --quiet || git commit -m "Daily results $TODAY"
          git push

      - name: Upload DSH logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-logs
          path: ${{ env.DSH_HOME }}/logs/
          if-no-files-found: warn