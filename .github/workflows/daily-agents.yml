name: Daily Research Agents

on:
  schedule:
    - cron: '0 4 * * *'   # Každý den ve 4:00 UTC
  workflow_dispatch:       # Ruční spuštění

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: smanx/deepseek-harness:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure DSH for Groq
        run: |
          export DSH_HOME=/workspace/.dsh
          mkdir -p $DSH_HOME
          cat > $DSH_HOME/cordis.patch.yml << 'EOF'
          - id: agent-default-model
            config:
              provider: groq
              model: qwen/qwen3.8-27b
          - id: llm-pi-ai
            config:
              providers:
                groq:
                  api: openai-completions
                  baseURL: https://api.groq.com/openai/v1
                  apiKeyEnv: GROQ_API_KEY
                  models:
                    - id: qwen/qwen3.8-27b
          EOF
      
      - name: Run all monitor agents sequentially
        env:
          DSH_HOME: /workspace/.dsh
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          for prompt_file in prompts/*.md; do
            echo "=== Spouštím: $prompt_file ==="
            cat "$prompt_file" | dsh --profile headless
          done

          mkdir -p output/$TODAY
          # Předpokládáme, že agent vytvořil soubory v kořeni
          for f in *.md; do
            [ -f "$f" ] || continue
            [ "$f" = "README.md" ] && continue
            mv "$f" output/$TODAY/
          done

      - name: Commit and push results
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/$TODAY/
          git diff --staged --quiet || git commit -m "Daily results $TODAY"
          git push