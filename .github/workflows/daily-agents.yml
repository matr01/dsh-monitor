name: Daily Research Agents

on:
  schedule:
    - cron: '0 4 * * *'   # Každý den ve 4:00 UTC
  workflow_dispatch:       # Ruční spuštění

permissions:
  contents: write

env:
  DSH_HOME: /workspace/.dsh

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: smanx/deepseek-harness:devtools-min-latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Minimal PTC plugin
        run: dsh plugin --profile web add dsh-minimal-ptc ./.github/dsh

      - name: Configure DSH for Groq
        run: |
          mkdir -p $DSH_HOME
          cat > $DSH_HOME/cordis.patch.yml << 'EOF'
          - id: compaction-basic
            config:
              thresholdRatio: 0.25
              headroomTokens: 0
              retainTokens: 256
              maxTokens: 1024
          - id: llm-pi-ai
            config:
              providers:
                groq:
                  api: openai-completions
                  baseURL: https://api.groq.com/openai/v1
                  apiKeyEnv: GROQ_API_KEY
                  compat:
                    supportsDeveloperRole: false
                  retryPolicy:
                    mode: normal
                    maxRetries: 5
                    retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, QUOTA, SERVER, TIMEOUT, TRANSPORT]
                    backoff:
                      initialDelayMs: 10000
                      maxDelayMs: 60000
                      jitterRatio: 0.2
                  models:
                    - id: qwen/qwen3.8-27b
                      contextWindow: 6000
                      maxTokens: 2048
                      compat:
                        supportsDeveloperRole: false
          EOF
      
      - name: Run all monitor agents sequentially
        env:
          DSH_AGENT_PRESET: ptc-minimal
          DSH_CI_PROVIDER: groq
          DSH_CI_MODEL: qwen/qwen3.8-27b
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          for prompt_file in prompts/*.md; do
            echo "=== Spouštím: $prompt_file ==="
            DSH_CI_PROMPT_FILE="$prompt_file" timeout --signal=TERM --kill-after=15s 30m dsh --profile web --no-open
          done

          mkdir -p output/$TODAY
          # Předpokládáme, že agent vytvořil soubory v kořeni
          for f in *.md; do
            [ -f "$f" ] || continue
            [ "$f" = "README.md" ] && continue
            mv "$f" output/$TODAY/
          done

      - name: Commit and push results
        working-directory: ${{ github.workspace }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/$TODAY/
          git diff --staged --quiet || git commit -m "Daily results $TODAY"
          git push

      - name: Upload DSH logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-logs
          path: ${{ env.DSH_HOME }}/logs/
          if-no-files-found: warn