name: Daily Research Agents

on:
  schedule:
    - cron: '0 4 * * *'   # Každý den ve 4:00 UTC
  workflow_dispatch:       # Ruční spuštění

permissions:
  contents: write

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: smanx/deepseek-harness:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run all monitor agents sequentially
        env:
          DSH_MODEL_PROVIDER: "openai-compatible"
          DSH_MODEL_BASE_URL: "https://api.groq.com/openai/v1"
          DSH_MODEL_NAME: "qwen/qwen3.8-27b"
          DSH_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          for prompt_file in prompts/*.md; do
            echo "=== Spouštím: $prompt_file ==="
            cat "$prompt_file" | dsh --profile headless
          done

          mkdir -p output/$TODAY
          mv *.md output/$TODAY/ 2>/dev/null || true    # Předpokládáme, že agent vytvořil soubory v kořeni

      - name: Commit and push results
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/$TODAY/
          git diff --staged --quiet || git commit -m "Daily results $TODAY"
          git push