name: Run Agents

# Společná část všech běhů. Plánované profily ji volají přes workflow_call
# (daily-default.yml, levice-*.yml); ručně lze spustit libovolnou kombinaci.
on:
  workflow_call:
    # workflow_call nepodporuje typ choice; hodnoty se ověřují v kroku níže.
    inputs:
      prompt_set:
        type: string
        default: default
      phase:
        type: string
        default: all
      model:
        type: string
        default: gemini-3.5-flash-lite
      date:
        type: string
        default: ''
      suffix:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      prompt_set:
        description: Sada promptů
        type: choice
        options:
          - default
          - levice
          - experimental
        default: default
      phase:
        description: Fáze běhu (all = vše, research = rešerše, synthesis = syntéza)
        type: choice
        options:
          - all
          - research
          - synthesis
        default: all
      model:
        description: Gemini model pro celý běh
        type: choice
        options:
          - gemini-3.5-flash-lite
          - gemini-3.1-flash-lite
          - gemini-3.8-flash
          - gemini-3-flash-preview
          - gemini-3.6-flash
          - gemini-4-hydrogen
        default: gemini-3.5-flash-lite
      date:
        description: Rozhodné datum v UTC (YYYY-MM-DD); prázdné = dnešní datum v UTC
        type: string
        required: false
        default: ''
      suffix:
        description: >-
          Přípona výstupní složky, např. "b" → output/YYYY-MM-DD-b (sada default)
          nebo output/YYYY-MM-DD-<sada>-b. Povolené znaky A-Z a-z 0-9 . _ -.
        type: string
        required: false
        default: ''

permissions:
  contents: write

env:
  DSH_HOME: /workspace/.dsh

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: ghcr.io/smanx/deepseek-harness:devtools-min-0.2.2-rc.3
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Re-run musí načíst i výsledky commitované předchozím pokusem.
          ref: ${{ github.ref }}

      - name: Resolve run parameters and output directory
        env:
          PROMPT_SET: ${{ inputs.prompt_set }}
          PHASE: ${{ inputs.phase }}
          MODEL: ${{ inputs.model }}
          RUN_DATE: ${{ inputs.date }}
          OUTPUT_SUFFIX: ${{ inputs.suffix }}
        run: |
          case "$PHASE" in
            all|research|synthesis) ;;
            *)
              echo "::error::Neplatná fáze '$PHASE' (all, research nebo synthesis)"
              exit 1
              ;;
          esac
          if ! printf '%s' "$PROMPT_SET" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::Neplatný název sady '$PROMPT_SET' (povolené znaky A-Z a-z 0-9 _ -)"
            exit 1
          fi
          PROMPT_DIR="prompts/$PROMPT_SET"
          if [ ! -d "$PROMPT_DIR" ]; then
            echo "::error::Složka s prompty '$PROMPT_DIR' neexistuje"
            exit 1
          fi
          if [ -n "$OUTPUT_SUFFIX" ] && ! printf '%s' "$OUTPUT_SUFFIX" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Neplatný suffix '$OUTPUT_SUFFIX' (povolené znaky A-Z a-z 0-9 . _ -)"
            exit 1
          fi
          if [ -z "$RUN_DATE" ]; then
            RUN_DATE="$(date -u +%Y-%m-%d)"
          fi
          if ! printf '%s' "$RUN_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Neplatné datum '$RUN_DATE' (očekáváno YYYY-MM-DD)"
            exit 1
          fi
          if ! normalized_date="$(date -u -d "$RUN_DATE" +%Y-%m-%d)" || [ "$normalized_date" != "$RUN_DATE" ]; then
            echo "::error::Neplatné kalendářní datum '$RUN_DATE'"
            exit 1
          fi
          OUTPUT_NAME="$RUN_DATE"
          if [ "$PROMPT_SET" != "default" ]; then
            OUTPUT_NAME="$OUTPUT_NAME-$PROMPT_SET"
          fi
          OUTPUT_DIR="output/$OUTPUT_NAME${OUTPUT_SUFFIX:+-$OUTPUT_SUFFIX}"
          echo "PROMPT_DIR=$PROMPT_DIR" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"
          echo "PHASE=$PHASE" >> "$GITHUB_ENV"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "Složka s prompty: $PROMPT_DIR"
          echo "Výstupní složka: $OUTPUT_DIR"
          echo "Fáze: $PHASE"
          echo "Model: $MODEL"

      - name: Configure DSH
        run: |
          mkdir -p "$DSH_HOME"
          cat > "$DSH_HOME/cordis.patch.yml" << EOF
          - id: agent-default-model
            config:
              provider: google
              model: $MODEL
          # LLM titulek by byl zbytečný požadavek navíc (free limit Gemini je cca 20/den).
          - id: session-title-llm
            disabled: true
          - id: llm-pi-ai
            config:
              providers:
                # Vestavěná routa (nativní Gemini protokol); bez api/baseURL.
                google:
                  apiKeyEnv: GEMINI_API_KEY
                  # Delší čekání na data streamu; celkový limit kroku zůstává 30 minut.
                  streamIdleTimeoutMs: 600000
                  # Free tier Gemini má limit požadavků/min; jeho překročení (429
                  # RESOURCE_EXHAUSTED) DSH hlásí jako QUOTA, proto se opakuje i QUOTA.
                  # Přetížení modelu (503 UNAVAILABLE) trvá i několik minut, proto
                  # 8 opakování: 30, 60, 120, 180, 180, 180, 180, 180 s (~18,5 min).
                  retryPolicy:
                    mode: normal
                    maxRetries: 8
                    retryableCodes: [RATE_LIMIT, QUOTA, SERVER, EMPTY_RESPONSE, TIMEOUT, TRANSPORT]
                    backoff:
                      initialDelayMs: 30000
                      maxDelayMs: 180000
                      jitterRatio: 0.2
                  # contextWindow omezuje kontext, nikoli celkovou spotřebu tokenů za minutu.
                  models:
                    - id: gemini-3.8-flash
                      contextWindow: 250000
                      maxTokens: 32768
                    - id: gemini-3.5-flash-lite
                      contextWindow: 250000
                      maxTokens: 32768
                    - id: gemini-3.1-flash-lite
                      contextWindow: 250000
                      maxTokens: 32768
                    - id: gemini-3-flash-preview
                      contextWindow: 250000
                      maxTokens: 32768
                    - id: gemini-3.6-flash
                      contextWindow: 250000
                      maxTokens: 32768
                    - id: gemini-4-hydrogen
                      contextWindow: 250000
                      maxTokens: 32768
          EOF

      - name: Run selected monitor agents sequentially
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          selected_prompts=0
          for prompt_file in "$PROMPT_DIR"/*.md; do
            if [ ! -f "$prompt_file" ]; then
              echo "::error::Chybí soubor promptu: $prompt_file (sada musí obsahovat .md prompty)"
              exit 1
            fi
            is_synthesis=false
            if grep -q '^# Vstupní podklady' "$prompt_file"; then
              is_synthesis=true
            fi
            if [ "$PHASE" = "research" ] && [ "$is_synthesis" = true ]; then
              continue
            fi
            if [ "$PHASE" = "synthesis" ] && [ "$is_synthesis" = false ]; then
              continue
            fi
            selected_prompts=$((selected_prompts + 1))
            output_file="${prompt_file##*/}"
            if [ -s "$OUTPUT_DIR/$output_file" ]; then
              echo "=== Přeskakuji hotový prompt: $prompt_file ==="
              continue
            fi
            if [ "$is_synthesis" = true ]; then
              for source_prompt in "$PROMPT_DIR"/*.md; do
                if grep -q '^# Vstupní podklady' "$source_prompt"; then
                  continue
                fi
                source_output="${source_prompt##*/}"
                if [ ! -f "$OUTPUT_DIR/$source_output" ] || [ ! -s "$OUTPUT_DIR/$source_output" ]; then
                  echo "::error::Chybí neprázdný podklad '$OUTPUT_DIR/$source_output'; syntézu nelze spustit"
                  exit 1
                fi
              done
            fi
            echo "=== Spouštím: $prompt_file (model: $MODEL) ==="
            prompt_text="$(
              cat "$prompt_file"
              printf '\n\n# Kontext běhu\n'
              printf 'Výstupní složka tohoto běhu: `%s` (cesta od kořene repozitáře).\n' "$OUTPUT_DIR"
              # Podklady z output/ smí číst jen prompty se sekcí "Vstupní podklady"
              # (syntéza); rešeršní prompty je jako zdroj používat nesmí.
              if [ "$is_synthesis" = true ]; then
                printf 'Hotové podklady čti pouze z této složky.\n'
              else
                printf 'Složka slouží jen k určení data; soubory v `output/` nečti\n'
                printf 'a nepoužívej je jako zdroj zpráv.\n'
              fi
              printf 'Rozhodné datum v UTC je prvních 10 znaků názvu této složky;\n'
              printf 'použij je pro časové okno monitoringu.\n'
              printf 'Vlastní výstup ulož do kořene repozitáře pod názvem určeným promptem;\n'
              printf 'přesun zajistí workflow.\n'
            )"
            timeout --signal=TERM --kill-after=15s 30m dsh --profile headless "$prompt_text"
            if [ ! -s "$output_file" ]; then
              echo "::error::Prompt '$prompt_file' nevytvořil neprázdný výstup '$output_file'"
              exit 1
            fi
            mv "$output_file" "$OUTPUT_DIR/"
          done
          if [ "$selected_prompts" -eq 0 ]; then
            echo "::error::Sada '$PROMPT_DIR' neobsahuje prompty pro fázi '$PHASE'"
            exit 1
          fi

      - name: Commit and push results
        if: ${{ always() && env.OUTPUT_DIR != '' }}
        run: |
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "Žádné výsledky k uložení."
            exit 0
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_DIR/"
          git diff --staged --quiet || git commit -m "Daily results ${OUTPUT_DIR#output/}"
          git push

      - name: Upload DSH logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-logs
          path: |
            ${{ env.DSH_HOME }}/logs/
            ${{ env.DSH_HOME }}/sessions/
          if-no-files-found: warn
